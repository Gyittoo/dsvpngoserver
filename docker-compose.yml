services:
  db:
    image: postgres:16-alpine
    container_name: dsvpn-postgres
    environment:
      POSTGRES_DB: dsvpn
      POSTGRES_USER: dsvpn_user
      POSTGRES_PASSWORD: dsvpn_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsvpn_user -d dsvpn"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dsvpn-api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://dsvpn_user:dsvpn_password@db:5432/dsvpn?sslmode=disable
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
